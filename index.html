<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بصريات أضواء - نظام القياس الاحترافي</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; background: #000; color: white; overflow: hidden; }
        #entry-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #222 0%, #000 100%); z-index: 100; text-align: center; }
        #capture-screen { display: none; position: fixed; inset: 0; flex-direction: column; z-index: 50; }
        #video-preview { width: 100%; height: 75%; object-fit: cover; background: #111; }
        #editor-screen { display: none; position: fixed; inset: 0; flex-direction: column; z-index: 25; }
        #canvas-wrap { position: relative; width: 100%; height: 70%; background: #1a1a1a; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #photo-result { max-width: 100%; max-height: 100%; pointer-events: none; }
        
        /* النظارة الشفافة */
        #glasses-overlay { 
            position: absolute; 
            width: 200px; 
            cursor: move; 
            touch-action: none; 
            z-index: 30; 
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        .toolbar { flex: 1; background: #111; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 15px; border-top: 3px solid #ffcc00; }
        .row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .btn { background: #ffcc00; color: #000; border: none; padding: 10px 18px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-add { background: #28a745; color: white; }
        .btn-reset { background: #fff; color: #000; }
        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="entry-screen">
        <h1 style="color: #ffcc00; font-size: 36px;">بصريات أضواء</h1>
        <button class="btn" style="padding: 15px 30px;" onclick="goToCapture()">ابدأ تجربة القياس 🕶️</button>
    </div>

    <div id="capture-screen">
        <video id="video-preview" playsinline autoplay></video>
        <div class="toolbar">
            <button class="btn" onclick="capturePhoto()" style="width: 80%; margin: 0 auto; padding: 15px;">التقط صورة للزبون 📸</button>
        </div>
    </div>

    <div id="editor-screen">
        <div id="canvas-wrap">
            <img id="photo-result">
            <!-- صورتك الشفافة مضافة هنا كافتراضية -->
            <img id="glasses-overlay" src="https://i.ibb.co/Lkv2Y7C/glasses-clear.png" draggable="false">
        </div>
        <div class="toolbar">
            <div class="row" id="glasses-menu">
                <button class="btn" onclick="setGlasses('https://i.ibb.co/Lkv2Y7C/glasses-clear.png')">موديل المحل الأصلي</button>
                <label for="file-input" class="btn btn-add">➕ أضف نظارة أخرى</label>
                <input type="file" id="file-input" accept="image/*" onchange="addNewGlasses(event)">
            </div>
            <div class="row">
                <button class="btn" onclick="resize(1.1)">➕ تكبير</button>
                <button class="btn" onclick="resize(0.9)">➖ تصغير</button>
                <button class="btn btn-reset" onclick="location.reload()">🔄 صورة جديدة</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-preview');
        const photoResult = document.getElementById('photo-result');
        const glasses = document.getElementById('glasses-overlay');
        const canvasWrap = document.getElementById('canvas-wrap');
        const glassesMenu = document.getElementById('glasses-menu');

        function goToCapture() {
            document.getElementById('entry-screen').style.display = 'none';
            document.getElementById('capture-screen').style.display = 'flex';
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                .then(stream => { video.srcObject = stream; });
        }

        function capturePhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            photoResult.src = canvas.toDataURL('image/png');
            document.getElementById('capture-screen').style.display = 'none';
            document.getElementById('editor-screen').style.display = 'flex';
        }

        function setGlasses(url) { glasses.src = url; }

        function addNewGlasses(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageUrl = e.target.result;
                    setGlasses(imageUrl);
                    const newBtn = document.createElement('button');
                    newBtn.className = 'btn';
                    newBtn.innerText = 'موديل جديد';
                    newBtn.onclick = () => { setGlasses(imageUrl); };
                    glassesMenu.insertBefore(newBtn, document.querySelector('.btn-add'));
                };
                reader.readAsDataURL(file);
            }
        }

        function resize(f) { glasses.style.width = (glasses.offsetWidth * f) + "px"; }

        // التحريك
        let isDragging = false, currentX = 0, currentY = 0, initialX, initialY;
        function dragStart(e) {
            let cx = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
            let cy = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
            initialX = cx - currentX; initialY = cy - currentY;
            if (e.target === glasses) isDragging = true;
        }
        function dragEnd() { isDragging = false; }
        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                let cx = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                let cy = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
                currentX = cx - initialX; currentY = cy - initialY;
                glasses.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        }
        canvasWrap.addEventListener("mousedown", dragStart);
        canvasWrap.addEventListener("touchstart", dragStart, {passive:false});
        window.addEventListener("mouseup", dragEnd);
        window.addEventListener("touchend", dragEnd);
        canvasWrap.addEventListener("mousemove", drag);
        canvasWrap.addEventListener("touchmove", drag, {passive:false});
    </script>
</body>
</html>
