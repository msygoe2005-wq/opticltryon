<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بصريات أضواء - VTO</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; background: #000; color: white; overflow: hidden; }
        
        /* شاشة 1: البداية */
        #entry-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 100; text-align: center; }
        
        /* شاشة 2: التقاط الصورة */
        #capture-screen { display: none; position: fixed; inset: 0; flex-direction: column; z-index: 50; }
        #video-preview { width: 100%; height: 80%; object-fit: cover; }

        /* شاشة 3: التعديل والقياس */
        #editor-screen { display: none; position: fixed; inset: 0; flex-direction: column; z-index: 25; }
        #canvas-wrap { position: relative; width: 100%; height: 75%; background: #222; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #photo-result { max-width: 100%; max-height: 100%; }
        #glasses-overlay { position: absolute; width: 160px; cursor: move; touch-action: none; z-index: 30; }

        /* العناصر المشتركة */
        .toolbar { flex: 1; background: #111; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 15px; border-top: 3px solid #ffcc00; }
        .btn { background: #ffcc00; color: #000; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <!-- الشاشة 1: البداية -->
    <div id="entry-screen">
        <h1 style="color: #ffcc00; font-size: 32px; margin-bottom: 20px;">بصريات أضواء</h1>
        <button class="btn" onclick="goToCapture()">ابدأ تجربة القياس 👓</button>
    </div>

    <!-- الشاشة 2: التقاط الصورة -->
    <div id="capture-screen">
        <video id="video" playsinline autoplay></video>
        <div class="toolbar">
            <button class="btn" onclick="capturePhoto()">التقط الصورة الآن 📸</button>
        </div>
    </div>

    <!-- الشاشة 3: التعديل والقياس -->
    <div id="editor-screen">
        <div id="canvas-wrap">
            <img id="photo-result">
            <!-- النظارة الافتراضية الأولى -->
            <img id="glasses-overlay" src="https://i.imgur.com/39D8Nn7.png" draggable="false">
        </div>
        <div class="toolbar">
            <div class="row">
                <button class="btn" onclick="setGlasses('https://i.imgur.com/39D8Nn7.png')">موديل 1 (Wayfarer)</button>
                <button class="btn" onclick="setGlasses('https://i.imgur.com/HnU5E98.png')">موديل 2 (Aviator)</button>
            </div>
            <div class="row">
                <button class="btn" onclick="resize(1.1)">➕ تكبير</button>
                <button class="btn" onclick="resize(0.9)">➖ تصغير</button>
                <button class="btn" onclick="location.reload()" style="background: #fff;">🔄 إعادة</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const photoResult = document.getElementById('photo-result');
        const glasses = document.getElementById('glasses-overlay');

        // الانتقال لشاشة الالتقاط وتشغيل الكاميرا
        function goToCapture() {
            document.getElementById('entry-screen').style.display = 'none';
            document.getElementById('capture-screen').style.display = 'flex';
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                .then(stream => { video.srcObject = stream; })
                .catch(() => alert("يرجى السماح بالوصول للكاميرا"));
        }

        // التقاط الصورة والانتقال لشاشة التعديل
        function capturePhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            photoResult.src = canvas.toDataURL('image/png');
            document.getElementById('capture-screen').style.display = 'none';
            document.getElementById('editor-screen').style.display = 'flex';
        }

        // تغيير موديل النظارة
        function setGlasses(url) {
            glasses.src = url;
        }

        // تحريك النظارة وتغيير حجمها
        function resize(f) { glasses.style.width = (glasses.offsetWidth * f) + "px"; }

        let active = false, xOff = 0, yOff = 0, startX, startY;
        const container = document.getElementById("canvas-wrap");

        container.addEventListener("touchstart", (e) => {
            active = true;
            startX = e.touches[0].clientX - xOff;
            startY = e.touches[0].clientY - yOff;
        });

        container.addEventListener("touchmove", (e) => {
            if (active) {
                e.preventDefault();
                xOff = e.touches[0].clientX - startX;
                yOff = e.touches[0].clientY - startY;
                glasses.style.transform = `translate3d(${xOff}px, ${yOff}px, 0)`;
            }
        });

        container.addEventListener("touchend", () => active = false);
    </script>
</body>
</html>
