<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بصريات أضواء - نظام القياس المطور</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; background: #000; color: white; overflow: hidden; }
        
        /* شاشة 1: البداية */
        #entry-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 100; text-align: center; }
        
        /* شاشة 2: التقاط الصورة */
        #capture-screen { display: none; position: fixed; inset: 0; flex-direction: column; z-index: 50; }
        #video-preview { width: 100%; height: 75%; object-fit: cover; background: #111; }

        /* شاشة 3: التعديل والقياس */
        #editor-screen { display: none; position: fixed; inset: 0; flex-direction: column; z-index: 25; }
        #canvas-wrap { position: relative; width: 100%; height: 70%; background: #222; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #photo-result { max-width: 100%; max-height: 100%; user-select: none; pointer-events: none; }
        #glasses-overlay { position: absolute; width: 180px; cursor: move; touch-action: none; z-index: 30; user-select: none; }

        /* شريط الأدوات */
        .toolbar { flex: 1; background: #111; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 12px; border-top: 3px solid #ffcc00; }
        .btn { background: #ffcc00; color: #000; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div id="entry-screen">
        <h1 style="color: #ffcc00; font-size: 28px; margin-bottom: 20px;">بصريات أضواء</h1>
        <button class="btn" onclick="goToCapture()">ابدأ تجربة القياس 🕶️</button>
    </div>

    <div id="capture-screen">
        <video id="video-preview" playsinline autoplay></video>
        <div class="toolbar">
            <button class="btn" onclick="capturePhoto()" style="padding: 15px;">التقط الصورة الآن 📸</button>
        </div>
    </div>

    <div id="editor-screen">
        <div id="canvas-wrap">
            <img id="photo-result">
            <!-- روابط بديلة مستقرة للنظارات -->
            <img id="glasses-overlay" src="https://openclipart.org/image/400px/171501" draggable="false">
        </div>
        <div class="toolbar">
            <div class="row">
                <button class="btn" onclick="setGlasses('https://openclipart.org/image/400px/171501')">موديل 1 (Wayfarer)</button>
                <button class="btn" onclick="setGlasses('https://openclipart.org/image/400px/216514')">موديل 2 (Aviator)</button>
            </div>
            <div class="row">
                <button class="btn" onclick="resize(1.1)">➕ تكبير</button>
                <button class="btn" onclick="resize(0.9)">➖ تصغير</button>
                <button class="btn" onclick="location.reload()" style="background: #fff;">🔄 إعادة</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-preview');
        const photoResult = document.getElementById('photo-result');
        const glasses = document.getElementById('glasses-overlay');
        const canvasWrap = document.getElementById('canvas-wrap');

        function goToCapture() {
            document.getElementById('entry-screen').style.display = 'none';
            document.getElementById('capture-screen').style.display = 'flex';
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                .then(stream => { video.srcObject = stream; })
                .catch(() => alert("يرجى السماح بالوصول للكاميرا"));
        }

        function capturePhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            photoResult.src = canvas.toDataURL('image/png');
            document.getElementById('capture-screen').style.display = 'none';
            document.getElementById('editor-screen').style.display = 'flex';
        }

        function setGlasses(url) { glasses.src = url; }
        function resize(f) { glasses.style.width = (glasses.offsetWidth * f) + "px"; }

        // نظام التحريك الشامل (ماوس + لمس)
        let isDragging = false, currentX = 0, currentY = 0, initialX, initialY;

        function dragStart(e) {
            initialX = (e.type === "touchstart" ? e.touches[0].clientX : e.clientX) - currentX;
            initialY = (e.type === "touchstart" ? e.touches[0].clientY : e.clientY) - currentY;
            if (e.target === glasses) isDragging = true;
        }

        function dragEnd() { isDragging = false; }

        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                let x = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                let y = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
                currentX = x - initialX;
                currentY = y - initialY;
                glasses.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        }

        canvasWrap.addEventListener("mousedown", dragStart);
        canvasWrap.addEventListener("touchstart", dragStart);
        window.addEventListener("mouseup", dragEnd);
        window.addEventListener("touchend", dragEnd);
        canvasWrap.addEventListener("mousemove", drag);
        canvasWrap.addEventListener("touchmove", drag);
    </script>
</body>
</html>
